# shopfront configuration
# set log_level = debug when troubleshooting

[auth]
db_host = localhost
log_level = debug
enable_debug_toolbar = yes
db_port = 6432
cache_host = localhost

[inventory]
db_host = localhost
cache_host = localhost
timeout = 87
db_hostname_check = strict
# debug_profiler = on
db_port = 5433

[billing]
db_host = localhost
log_level = info
db_name = billing
debug_sql = true
